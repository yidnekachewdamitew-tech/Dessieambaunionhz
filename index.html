:root{--ink:#1b2b3f;--teal:#1f5fa8;--line:#cbd5e1;--bg:#e9eef5;--mute:#5a6b7d;--green:#157347;--red:#b42318}

  var fyOk=true;if(!canPage(tab))tab="home";ivAuto();setSync("✓");render();setLangUI();startPoll()}
function setSync(s){var e=document.getElementById("syncb");if(e)e.textContent=s}
function syncClick(){if(CL.pendingRemote&&!CL.dirty&&!CL.busy){CL.pendingRemote=false;cloudLoad(false)}}
// ---- ማስቀመጥ ----
function cloudSaved(){
  if(!CLOUD||!CL.booted)return;
  if(!canWrite()){toast("ተመልካች ነዎት — ማስተካከል አይፈቀድም");cloudLoad(false);return}
  CL.dirty=true;setSync("⏳");clearTimeout(CL.timer);CL.timer=setTimeout(cloudPush,700)}
function cloudPush(){
  if(CL.busy){CL.dirty=true;return}if(!CL.dirty)return;
  CL.busy=true;CL.dirty=false;
  var snap=JSON.stringify(S),log=auditDiff(CL.base,S);
  sb.rpc("save_state",{new_data:JSON.parse(snap),expected_version:CL.ver,log_text:log}).then(function(r){
    CL.busy=false;
    if(r.error){if(/conflict/i.test(r.error.message))return cloudConflict();
      setSync("⚠️");toast("ማስቀመጥ አልተሳካም፦ "+r.error.message);CL.dirty=true;setTimeout(cloudPush,10000);return}
    CL.ver=r.data;CL.base=snap;setSync("✓");if(CL.dirty)cloudPush()
  }).catch(function(){CL.busy=false;CL.dirty=true;setSync("⚠️");setTimeout(cloudPush,10000)})}
function cloudConflict(){
  CL.busy=true;
  return sb.from("app_state").select("data,version").eq("id",1).maybeSingle().then(function(r){
    CL.busy=false;if(r.error||!r.data){CL.dirty=true;setTimeout(cloudPush,5000);return}
    var srv=normObj(r.data.data),base=normObj(JSON.parse(CL.base));
    var m=mergeState(base,S,srv);m.lang=localLang();S=m;applyAccs();
    CL.ver=r.data.version;CL.base=JSON.stringify(srv);CL.dirty=true;
    toast("🔄 ሌላ ሰው ለውጥ አድርጎ ነበር — ተዋህዷል");ivAuto();render();cloudPush()})}
function mergeState(base,loc,srv){
  var J=JSON.stringify,out=JSON.parse(J(srv));
  var arr=function(b,l,s){b=b||[];l=l||[];s=s||[];var bs={},ls={};b.forEach(function(x){bs[J(x)]=1});l.forEach(function(x){ls[J(x)]=1});
    var rm={};b.forEach(function(x){if(!ls[J(x)])rm[J(x)]=1});var res=s.filter(function(x){return!rm[J(x)]}),have={};res.forEach(function(x){have[J(x)]=1});
    l.forEach(function(x){var k=J(x);if(!bs[k]&&!have[k]){res.push(x);have[k]=1}});return res};
  out.jr={i:arr(base.jr.i,loc.jr.i,srv.jr.i),e:arr(base.jr.e,loc.jr.e,srv.jr.e)};
  out.mem=arr(base.mem,loc.mem,srv.mem);out.mtx=arr(base.mtx,loc.mtx,srv.mtx);
  (function(){var seen={};for(var i=out.mtx.length-1;i>=0;i--){var x=out.mtx[i];if(!x.auto)continue;var k=x.mb+"|"+x.auto;if(seen[k])out.mtx.splice(i,1);else seen[k]=1}})();out.mseq=Math.max(base.mseq||0,loc.mseq||0,srv.mseq||0);
  Object.keys(loc).forEach(function(k){if(k=="jr"||k=="mem"||k=="mtx"||k=="mseq"||k=="lang")return;
    if(J(loc[k])!=J(base[k])&&J(srv[k])==J(base[k]))out[k]=loc[k]});
  return normObj(out)}
function auditDiff(bs,cur){
  var out=[],J=JSON.stringify;
  try{var b=normObj(JSON.parse(bs||"{}"));
    var items=function(a,o,label,key,txt){var os={},cs={};(o||[]).forEach(function(x){os[J(x)]=x});(a||[]).forEach(function(x){cs[J(x)]=x});
      var add=[],rem=[];Object.keys(cs).forEach(function(k){if(!os[k])add.push(cs[k])});Object.keys(os).forEach(function(k){if(!cs[k])rem.push(os[k])});
      add.forEach(function(x){var i=-1;rem.forEach(function(r,ix){if(i<0&&key(x)!==""&&key(r)==key(x))i=ix});
        if(i>-1)rem.splice(i,1);out.push(label+" "+txt(x)+(i>-1?" ተስተካክሏል":" ተመዝግቧል"))});
      rem.forEach(function(x){out.push(label+" "+txt(x)+" ተሰርዟል")})};
    var je=function(x){return"ቁ."+(x.n||"—")+" «"+(x.t||"")+"» "+f(sum(x.v||[]))+" ብር"};
    items(cur.jr.i,b.jr.i,"ገቢ ደረሰኝ",function(x){return String(x.n||"")},je);
    items(cur.jr.e,b.jr.e,"ወጪ ማዘዣ",function(x){return String(x.n||"")},je);
    items(cur.mem,b.mem,"አባል",function(x){return String(x.id)},function(x){return x.name});
    var man=function(a){return(a||[]).filter(function(x){return!x.auto})},au=function(a){return(a||[]).filter(function(x){return x.auto})};
    items(man(cur.mtx),man(b.mtx),"የአባል ግብይት",function(x){return String(x.id)},function(x){return(x.t||x.k)+" "+f(x.a)});
    if(J(au(cur.mtx))!=J(au(b.mtx)))out.push("ወለድ በራስ-ሰር ተሰልቷል/ተዘምኗል");
    var nm={reg:"የቅርንጫፍ ገቢ/ወጪ መዝገብ",open:"የመነሻ ቀሪዎች",adj:"ማስተካከያ",fy:"የበጀት ዓመት",accs:"ሂሳቦች",rates:"የወለድ ተመን",hid:"የተደበቁ ሂሳቦች",grp:"ቡድኖች",man:"የእጅ ግቤቶች",logo:"ዓርማ",yrs:"የሌሎች ዓመታት መረጃ"},oth=[];
    Object.keys(cur).forEach(function(k){if(["jr","mem","mtx","mseq","lang","ivFrom"].indexOf(k)>-1)return;if(J(cur[k])!=J(b[k]))oth.push(nm[k]||k)});
    if(oth.length)out.push("ሌሎች ለውጦች፦ "+oth.join("፣ "))
  }catch(e){out.push("ለውጥ (ዝርዝር አልተለየም)")}
  return out.slice(0,60).join("\n")}
// ---- ማመሳሰል ----
function startPoll(){clearInterval(CL.poll);CL.poll=setInterval(cloudPoll,20000);if(!CL.vis){CL.vis=true;document.addEventListener("visibilitychange",function(){if(!document.hidden)cloudPoll()})}}
function cloudPoll(){
  if(!sb||!CL.booted||CL.busy||CL.dirty)return;
  sb.from("profiles").select("role").eq("id",CL.user.id).maybeSingle().then(function(p){if(p.data&&p.data.role!=CL.role)location.reload()});
  sb.from("app_state").select("version").eq("id",1).maybeSingle().then(function(r){
    if(r.error||!r.data||r.data.version<=CL.ver)return;
    var a=document.activeElement;
    if(tab=="jf"||(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))){CL.pendingRemote=true;setSync("🔄 አዲስ ለውጥ — ተጫን");return}
    cloudLoad(false)})}
// ---- ተጠቃሚዎችና መዝገብ ----
function vUsr(){setTimeout(usrLoad,0);return'<div class="card"><h2>👤 ተጠቃሚዎች</h2><p class="note">አዲስ ሰው በመግቢያው ገጽ «አዲስ መለያ» ሲከፍት «ፈቃድ በመጠባበቅ ላይ» ይሆናል፤ እዚህ ሚና ይስጡት። ሚና ሲቀየር ተጠቃሚው በቀጣዩ ማመሳሰል (እስከ 20 ሰከንድ) ይዘምናል።</p><div id="usrbox">⏳</div></div>'}
function usrLoad(){sb.from("profiles").select("*").order("created_at").then(function(r){var b=document.getElementById("usrbox");if(!b)return;
  if(r.error){b.textContent="አልተሳካም፦ "+r.error.message;return}
  b.innerHTML='<div class="wrap"><table><thead><tr><th class="s">ስም</th><th class="l">ኢሜይል</th><th>ሚና</th></tr></thead><tbody>'+r.data.map(function(p){var me=p.id==CL.user.id;
    return'<tr><th class="s">'+esc(p.full_name||"—")+'</th><td class="l">'+esc(p.email||"")+'</td><td><select '+(me?"disabled ":"")+'onchange="usrSet(\''+p.id+'\',this.value)">'+Object.keys(ROLES).map(function(k){return'<option value="'+k+'"'+(k==p.role?" selected":"")+">"+(k=="pending"?"⛔ ታግዷል / በመጠባበቅ":ROLES[k])+"</option>"}).join("")+'</select></td></tr>'}).join("")+'</tbody></table></div><p class="note">ሚናዎች፦ <b>አስተዳዳሪ</b> ሁሉንም ያደርጋል። <b>ሂሳብ ሠራተኛ</b> ከተጠቃሚ ማስተዳደርና ምትኬ መመለስ በስተቀር ሁሉንም። <b>ገንዘብ ያዥ</b> ደረሰኝ/ማዘዣ ማስገባት፣ ጆርናል፣ አባላት። <b>ተመልካች</b> ማየት ብቻ።</p>'})}
function usrSet(id,role){sb.from("profiles").update({role:role}).eq("id",id).then(function(r){toast(r.error?"አልተሳካም፦ "+r.error.message:"ተቀምጧል ✓");usrLoad()})}
function vLog(){setTimeout(logLoad,0);return'<div class="card"><h2>🕵️ የእንቅስቃሴ መዝገብ</h2><p class="note">የመጨረሻዎቹ 200 እንቅስቃሴዎች — ማን፣ መቼ፣ ምን እንዳስገባ ወይም እንደቀየረ።</p><div id="logbox">⏳</div></div>'}
function logLoad(){sb.from("audit_log").select("*").order("at",{ascending:false}).limit(200).then(function(r){var b=document.getElementById("logbox");if(!b)return;
  if(r.error){b.textContent="አልተሳካም፦ "+r.error.message;return}
  b.innerHTML=r.data.length?'<div class="wrap"><table><thead><tr><th class="s">መቼ</th><th class="l">ማን</th><th class="l">ምን</th></tr></thead><tbody>'+r.data.map(function(x){var d=new Date(x.at);return'<tr><th class="s">'+esc(d.toLocaleString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}))+'</th><td class="l">'+esc(x.email||"")+'</td><td class="l" style="white-space:normal;min-width:240px">'+esc(x.action)+'</td></tr>'}).join("")+'</tbody></table></div>':'<div class="note">እስካሁን እንቅስቃሴ የለም።</div>'})}

cloudInit();
</script>
